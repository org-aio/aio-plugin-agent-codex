name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: org-aio/aio-platform
          ref: 7a9d622d5853fe632fee8edb617af3120e65863c
          path: .local/platform
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:native
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          AIO_PLATFORM_ROOT: .local/platform
      - run: rustup toolchain install nightly-2026-05-25 --profile minimal
      - run: cargo test --locked
      - run: npm pack --dry-run
